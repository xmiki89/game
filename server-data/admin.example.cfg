# Admin-Passwort für den Befehl /admin im Chat
# 1. Diese Datei als admin.cfg kopieren (wird nicht in Git eingecheckt)
# 2. Unten ein eigenes Passwort eintragen
# 3. Server neu starten, im Chat "/admin DEINPASSWORT" eingeben
#
# Achtung: Der Befehl wird im Chat getippt und steht damit auch in
# Chat-Logs. Kein Passwort verwenden, das du woanders benutzt.

setr rp_adminPassword "DEIN_PASSWORT_HIER"
