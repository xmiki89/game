# ==========================================================
#  Los Santos Life - FiveM Roleplay / Reallife Server
#  Framework: Standalone (kein ESX, kein QBCore)
#
#  Starten:  FXServer.exe +exec server.cfg
#  (FXServer.exe liegt eine Ebene ueber diesem Ordner)
# ==========================================================

# --- Netzwerk -------------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# --- Lizenz (PFLICHT!) ----------------------------------------------------
# Key erstellen auf https://keymaster.fivem.net und hier eintragen:
sv_licenseKey "DEIN_LIZENZKEY_HIER"

# --- Server-Infos ---------------------------------------------------------
sv_hostname "^2Los Santos Life ^7| ^5Roleplay & Reallife ^7| ^3Deutsch"
sv_projectName "Los Santos Life"
sv_projectDesc "Deutscher Roleplay-Server - eigenes Framework, Tablet, HUD, Charaktererstellung"
sv_maxclients 32
sets locale "de-DE"
sets tags "roleplay,reallife,deutsch,german,rp,life"

# --- OneSync (wichtig fuer RP) --------------------------------------------
set onesync on
setr voice_useSendingRangeOnly true

# --- Basissysteme ---------------------------------------------------------
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure fivem

# --- Unser Framework ------------------------------------------------------
# Reihenfolge wichtig: rp_core muss zuerst starten
ensure rp_core
ensure rp_character
ensure rp_hud
ensure rp_tablet

# --- Admin ----------------------------------------------------------------
add_ace group.admin command allow
add_ace group.admin rp.admin allow
# Eigene Lizenz eintragen, damit du Admin wirst:
# add_principal identifier.license:DEINE_LICENSE_HIER group.admin
