# ==========================================================
#  Los Santos Life - FiveM Roleplay / Reallife Server
#  Framework: Standalone (kein ESX, kein QBCore)
#
#  Starten:  FXServer.exe +exec server.cfg
#  (FXServer.exe liegt eine Ebene ueber diesem Ordner)
# ==========================================================

# --- Netzwerk -------------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# --- Lizenz (PFLICHT!) ----------------------------------------------------
# Der Key steht in license.cfg (ist absichtlich NICHT im Git).
# Vorlage: license.example.cfg -> kopieren nach license.cfg und Key eintragen.
exec license.cfg

# --- Server-Infos ---------------------------------------------------------
# Name, Beschreibung, Tags und Banner werden seit 2025 im Cfx-Portal gepflegt:
# https://portal.cfx.re/  (sv_hostname gilt weiter fuer die Konsole)
sv_hostname "^2Los Santos Life ^7| ^5Roleplay & Reallife ^7| ^3Deutsch"
sv_maxclients 32
sets locale "de-DE"

# --- OneSync (wichtig fuer RP) --------------------------------------------
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync on
setr voice_useSendingRangeOnly true

# --- Basissysteme (Pflicht: ohne diese spawnt kein Spieler) ---------------
ensure mapmanager
ensure chat
ensure spawnmanager

# --- Unser Framework ------------------------------------------------------
# Reihenfolge wichtig: rp_core muss zuerst starten
ensure rp_core
ensure rp_character
ensure rp_hud
ensure rp_tablet

# --- Admin ----------------------------------------------------------------
add_ace group.admin command allow
add_ace group.admin rp.admin allow
# Eigene Lizenz eintragen, damit du Admin wirst:
# add_principal identifier.license:DEINE_LICENSE_HIER group.admin
